name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to release (`v1.2.3` or `1.2.3`). Empty uses the first release heading of the changelog.
        required: false
        type: string
        default: ""
      release-notes:
        description: Release notes. Empty uses the changelog section of the version.
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: false
        type: boolean
        default: false
      changelog-path:
        description: Path of the changelog, relative to the repository root.
        required: false
        type: string
        default: CHANGELOG.md
      release-branch:
        description: Branch the released commit must be reachable from. Empty uses the repository default branch.
        required: false
        type: string
        default: ""
      update-major-tag:
        description: Force-move the major tag (`v1`) to stable releases. Meant for action and reusable-workflow repositories.
        required: false
        type: boolean
        default: false
      tfc-organization:
        description: HCP Terraform organization. With `tfc-workspace`, the release waits for the workspace apply of the commit when `terraform-path` changed.
        required: false
        type: string
        default: ""
      tfc-workspace:
        description: HCP Terraform workspace awaited before the release.
        required: false
        type: string
        default: ""
      terraform-path:
        description: Path whose changes since the previous release make the release wait for HCP Terraform.
        required: false
        type: string
        default: terraform
      tfc-start-timeout-minutes:
        description: Minutes to wait for HCP Terraform to start a run for the commit.
        required: false
        type: string
        default: "30"
      infrastructure-timeout-minutes:
        description: Timeout of the job that waits for HCP Terraform, including manual apply approval.
        required: false
        type: number
        default: 360
      deploy-workflow:
        description: Workflow file dispatched on the release tag after the release, for example `deploy.yml`. Empty skips it.
        required: false
        type: string
        default: ""
      deploy-tag-input:
        description: Input of `deploy-workflow` that receives the release tag. Empty dispatches without inputs.
        required: false
        type: string
        default: tag
      runs-on:
        description: Runner label for every job. Empty uses the `CI_RUNNER` variable, then `ubuntu-latest`.
        required: false
        type: string
        default: ""
    secrets:
      TFC_API_TOKEN:
        description: HCP Terraform API token, required with `tfc-workspace`.
        required: false
    outputs:
      version:
        description: The resolved release version.
        value: ${{ jobs.prepare.outputs.version }}
      skipped:
        description: "`true` when the release was skipped (already released, or the PR was merged through another PR)."
        value: ${{ jobs.prepare.outputs.skip }}

concurrency:
  group: fbrissi-release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      version: ${{ steps.release.outputs.version }}
      major_version: ${{ steps.release.outputs.major_version }}
      stable: ${{ steps.release.outputs.stable }}
      sha: ${{ steps.release.outputs.sha }}
      release_notes: ${{ steps.release.outputs.release_notes }}
      terraform_changed: ${{ steps.terraform.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release details
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_NOTES: ${{ inputs.release-notes }}
          CHANGELOG: ${{ inputs.changelog-path }}
          RELEASE_BRANCH: ${{ inputs.release-branch || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          skip() {
            echo "::notice::Skipping release: $1"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          is_pull_request=false
          if [ "$EVENT_NAME" = 'pull_request' ] || [ "$EVENT_NAME" = 'pull_request_target' ]; then
            is_pull_request=true
            if [ "$PR_MERGED" != 'true' ]; then
              skip 'the pull request was closed without merging.'
            fi
            # A PR marked merged because its commits landed through another PR is not a parent of the merge commit;
            # that other PR's run releases the commit.
            read -r -a parents <<<"$(git rev-list --parents -n 1 "$MERGE_COMMIT_SHA" | cut -d' ' -f2-)"
            if [ "${#parents[@]}" -gt 1 ] && ! printf '%s\n' "${parents[@]}" | grep -qx "$PR_HEAD_SHA"; then
              skip "PR head $PR_HEAD_SHA is not a parent of merge commit $MERGE_COMMIT_SHA."
            fi
          fi

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -nE 's/^## (v[0-9][^[:space:]]*)$/\1/p' "$CHANGELOG" | head -n 1)
          fi
          version="v${version#v}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Semantic Versioning release version '$version'. $CHANGELOG must start with ## vMAJOR.MINOR.PATCH."
            exit 1
          fi

          notes="$INPUT_RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes=$(awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$CHANGELOG")
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::Release $version must include release notes."
            exit 1
          fi

          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" "origin/$RELEASE_BRANCH"; then
            echo "::error::Release commit $sha must be reachable from $RELEASE_BRANCH."
            exit 1
          fi

          tag_exists=false
          if tag_sha=$(git rev-parse -q --verify "refs/tags/$version^{}"); then
            if [ "$tag_sha" != "$sha" ]; then
              if [ "$is_pull_request" = 'true' ]; then
                skip "$version is already released at $tag_sha. Add a new $CHANGELOG version to release."
              fi
              echo "::error::Release tag $version already points to a different commit ($tag_sha)."
              exit 1
            fi
            tag_exists=true
          fi

          stable=true
          if [[ "$version" == *-* ]]; then
            stable=false
          fi
          major_version="${version%%.*}"

          delimiter="EOF_$(uuidgen)"
          {
            echo 'skip=false'
            echo "version=$version"
            echo "major_version=$major_version"
            echo "stable=$stable"
            echo "sha=$sha"
            echo "tag_exists=$tag_exists"
            echo "release_notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $sha."

      - name: Check whether the release changes Terraform
        id: terraform
        if: ${{ steps.release.outputs.skip != 'true' && inputs.tfc-workspace != '' }}
        env:
          TERRAFORM_PATH: ${{ inputs.terraform-path }}
        run: |
          set -euo pipefail

          if ! previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null); then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$previous_tag" HEAD -- "$TERRAFORM_PATH"; then
            echo "No changes under $TERRAFORM_PATH since $previous_tag."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  wait-for-infrastructure:
    name: Wait for Infrastructure
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.terraform_changed == 'true' }}
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions: {}
    timeout-minutes: ${{ inputs.infrastructure-timeout-minutes }}
    steps:
      - name: Require HCP Terraform settings
        env:
          TFC_ORGANIZATION: ${{ inputs.tfc-organization }}
          HAS_TOKEN: ${{ secrets.TFC_API_TOKEN != '' }}
        run: |
          if [ -z "$TFC_ORGANIZATION" ] || [ "$HAS_TOKEN" != 'true' ]; then
            echo '::error::tfc-workspace requires the tfc-organization input and the TFC_API_TOKEN secret.'
            exit 1
          fi

      - uses: fbrissi/github-actions/actions/terraform-cloud-wait@v1
        with:
          organization: ${{ inputs.tfc-organization }}
          workspace: ${{ inputs.tfc-workspace }}
          token: ${{ secrets.TFC_API_TOKEN }}
          commit-sha: ${{ needs.prepare.outputs.sha }}
          start-timeout-minutes: ${{ inputs.tfc-start-timeout-minutes }}

  release:
    name: Create Release
    needs: [prepare, wait-for-infrastructure]
    if: >-
      ${{ always() && !cancelled()
      && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
      && (needs.wait-for-infrastructure.result == 'success' || needs.wait-for-infrastructure.result == 'skipped') }}
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Create and push tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION" "$SHA" -m "Release $VERSION"
          fi
          if git push origin "refs/tags/$VERSION"; then
            exit 0
          fi

          # A concurrent run may have pushed the same tag; accept it only when it points to the same commit.
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          if [ "$(git rev-parse "refs/tags/$VERSION^{}")" != "$SHA" ]; then
            echo "::error::Release tag $VERSION could not be pushed and does not point to $SHA."
            exit 1
          fi
          echo "::notice::Release tag $VERSION was already pushed to $SHA."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease || needs.prepare.outputs.stable != 'true' }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "::notice::GitHub release $VERSION already exists."
            exit 0
          fi

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          args=("$VERSION" --verify-tag --title "Release $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi

          if ! gh release create "${args[@]}"; then
            gh release view "$VERSION" --json tagName >/dev/null
            echo "::notice::GitHub release $VERSION was created by a concurrent run."
          fi

      - name: Move major tag
        if: ${{ inputs.update-major-tag && !inputs.prerelease && needs.prepare.outputs.stable == 'true' }}
        env:
          MAJOR_VERSION: ${{ needs.prepare.outputs.major_version }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          latest=$(git tag --list "${MAJOR_VERSION}.*" --sort=-version:refname | grep -vE -- '-' | head -n 1)
          if [ "$latest" != "$VERSION" ]; then
            echo "::notice::$MAJOR_VERSION stays on $latest, which is newer than $VERSION."
            exit 0
          fi

          git tag --force "$MAJOR_VERSION" "$SHA" -m "Release $VERSION"
          git push --force origin "refs/tags/$MAJOR_VERSION"
          echo "Moved $MAJOR_VERSION to $VERSION ($SHA)."

      - name: Dispatch deploy
        if: ${{ inputs.deploy-workflow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          DEPLOY_TAG_INPUT: ${{ inputs.deploy-tag-input }}
        run: |
          set -euo pipefail

          count=$(gh run list --workflow "$DEPLOY_WORKFLOW" --event workflow_dispatch --branch "$VERSION" \
            --json databaseId --jq length)
          if [ "$count" -gt 0 ]; then
            echo "::notice::$DEPLOY_WORKFLOW was already dispatched for $VERSION; re-run that deploy to retry it."
            exit 0
          fi

          args=("$DEPLOY_WORKFLOW" --ref "$VERSION")
          if [ -n "$DEPLOY_TAG_INPUT" ]; then
            args+=(-f "${DEPLOY_TAG_INPUT}=${VERSION}")
          fi
          gh workflow run "${args[@]}"
          echo "Dispatched $DEPLOY_WORKFLOW on $VERSION."
