# actionlint 1.7.12 bundles create-github-app-token metadata older than its v3 `client-id` input. The action also
# forwards any `permission-*` input, so `permission-issue-fields` reaches the token although v3 does not declare it.
paths:
  .github/workflows/{code-review,pr-fix,merge-decision,ai-task,ai-resume,branch-sync}.yml:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'input "permission-issue-fields" is not defined in action "actions/create-github-app-token@v3"'
