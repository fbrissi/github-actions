name: PR Gate
description: >-
  Deterministic gates and markers of the PR follow-up, with no AI involved: decide whether a pr-fix pass runs or
  escalates, whether a merge decision runs, and record each pass and decision on the pull request.
author: Filipe Bojikian Rissi

inputs:
  command:
    description: "`feedback-dispatch`, `quality-join`, `fix-gate`, `fix-record`, `fix-finish`, `merge-dispatch`, `merge-gate`, `merge-outcome`, or `merge-record`."
    required: true
  github-token:
    description: Token for the GitHub API. `feedback-dispatch` needs `actions` write and `pull-requests` read; `fix-gate` needs `checks` write and `issues` and `pull-requests` read; `fix-finish` needs `checks` write; `merge-dispatch` needs `actions` write; `quality-join`, and `feedback-dispatch` with `qa-check-name`, need `actions` write, `checks` read, and `pull-requests` write; `merge-gate` needs `actions`, `checks`, `issues`, `pull-requests`, and `statuses` read; the record commands need a GitHub App token with `pull-requests` write, because only bot comments count as markers.
    required: false
    default: ${{ github.token }}
  pr-number:
    description: Pull request number.
    required: false
    default: ""
  opt-in-label:
    description: "`fix-gate`: label that opts a pull request into automatic fixes. `merge-gate`: the same label of the PR Fix caller."
    required: false
    default: ai:auto-fix
  branch-prefixes:
    description: "`fix-gate`: head branch prefixes that also opt a pull request in. `merge-gate`: head branch prefixes a pull request must match (empty matches every pull request)."
    required: false
    default: ""
  max-rounds:
    description: "`fix-gate` and `fix-record`: fix passes allowed before escalation. `merge-gate`: the same limit of the PR Fix caller."
    required: false
    default: "3"
  escalation-label:
    description: "`fix-gate`: label that blocks further passes while present. `merge-gate`: the same label of the PR Fix caller."
    required: false
    default: ai:needs-human
  fix-branch-prefixes:
    description: "`merge-gate`: head branch prefixes that opt a pull request into the PR Fix caller (its `branch-prefixes`)."
    required: false
    default: ""
  check-name:
    description: "`fix-gate` and `fix-finish`: name of the check run reported on the head commit."
    required: false
    default: PR Fix
  required-human-approvals:
    description: "`merge-gate`: approvals by human users required on the head commit."
    required: false
    default: "1"
  human-approval-exempt-base-prefixes:
    description: "`merge-gate`: base branch prefixes whose pull requests need no human approval."
    required: false
    default: ""
  human-approval-exempt-authors:
    description: "`merge-gate`: pull request authors that may skip human approval when the base also matches `human-approval-exempt-base-prefixes`. Empty means any GitHub App bot (never a person)."
    required: false
    default: ""
  approval-labels:
    description: "`merge-gate`: labels that require a human approval of the head commit even when the pull request is exempt (for example a sign-off on legal text). Unlike `escalation-label`, they never stop a fix pass."
    required: false
    default: ai:needs-approval
  hold-labels:
    description: "`merge-gate`: labels that block any decision."
    required: false
    default: do-not-merge hold
  round:
    description: "`fix-record`: fix round number (the `round` output of `fix-gate`)."
    required: false
    default: ""
  start-sha:
    description: "`fix-record`: head commit the pass started from."
    required: false
    default: ""
  outcome:
    description: "`fix-record` and `merge-outcome`: outcome of the harness step."
    required: false
    default: ""
  head-sha:
    description: "`merge-record`: head commit the decision was made on."
    required: false
    default: ""
  result:
    description: "`fix-finish`: result of the fix job, `success` or anything else."
    required: false
    default: ""
  check-run-id:
    description: "`fix-finish`: check run to complete (the `check_run_id` output of `fix-gate`)."
    required: false
    default: ""
  merge-workflow:
    description: "`merge-dispatch` and `feedback-dispatch`: workflow file dispatched with `pr_number` on the default branch, for example `merge-decision.yml`. Empty dispatches nothing."
    required: false
    default: ""
  fix-workflow:
    description: "`feedback-dispatch`: workflow file dispatched with `pr_number` for review feedback. Empty dispatches nothing. `merge-gate`: while a run of it is queued, the pull request could get a pass (opted in, not escalated, rounds left), and it has review feedback newer than its last fix round, unresolved review threads only skip; otherwise they set `handoff`."
    required: false
    default: ""
  ignore-authors:
    description: "`feedback-dispatch`: logins whose reviews never dispatch `fix-workflow`. `merge-gate`: their feedback never waits for a queued fix run."
    required: false
    default: ""
  ignore-reply-authors:
    description: "`feedback-dispatch`: logins whose reply-only reviews never dispatch `fix-workflow`."
    required: false
    default: ""
  output-file:
    description: "`merge-outcome`: harness output file to read the merge-risk result from. Empty uses the ai-harness default under `RUNNER_TEMP`."
    required: false
    default: ""
  merge-check-name:
    description: "`feedback-dispatch`: check run whose successful completion dispatches `merge-workflow`. Empty disables it."
    required: false
    default: ""
  qa-check-name:
    description: "`quality-join`, and `feedback-dispatch` for reviews: check run of the QA workflow. When set, a review no longer dispatches on its own: once the `review-check-name` and this check of the head commit have completed, `merge-workflow` is dispatched when both sides approve, otherwise `fix-workflow`. Empty keeps reviews dispatching directly."
    required: false
    default: ""
  review-check-name:
    description: "`quality-join`: check run of the code review workflow."
    required: false
    default: Code Review
  qa-workflow:
    description: "`quality-join`: workflow file of the QA caller; only `qa-check-name` check runs of its runs dispatched on the default branch count."
    required: false
    default: qa.yml
  review-workflow:
    description: "`quality-join`: workflow file of the code review caller; only `review-check-name` check runs of its runs dispatched on the default branch count."
    required: false
    default: code-review.yml

outputs:
  action:
    description: "`fix-gate`: `fix`, `escalate`, or `skip`. `merge-gate`: `decide` or `skip`."
    value: ${{ steps.run.outputs.action }}
  pr_number:
    description: Pull request number, when a gate got that far.
    value: ${{ steps.run.outputs.pr_number }}
  round:
    description: "`fix-gate`: round number of this pass."
    value: ${{ steps.run.outputs.round }}
  head_ref:
    description: "`fix-gate`: head branch."
    value: ${{ steps.run.outputs.head_ref }}
  head_sha:
    description: "`merge-gate`: head commit."
    value: ${{ steps.run.outputs.head_sha }}
  base_ref:
    description: "`merge-gate`: base branch."
    value: ${{ steps.run.outputs.base_ref }}
  base_sha:
    description: Base commit.
    value: ${{ steps.run.outputs.base_sha }}
  check_run_id:
    description: "`fix-gate`: check run created for this pass."
    value: ${{ steps.run.outputs.check_run_id }}
  required_approvals:
    description: "`merge-gate`: human approvals the pull request needs."
    value: ${{ steps.run.outputs.required_approvals }}
  result:
    description: "`merge-outcome`: `merged`, `held`, or `not-evaluated`."
    value: ${{ steps.run.outputs.result }}
  request_review:
    description: "`merge-gate`: `true` when human approvals are missing."
    value: ${{ steps.run.outputs.request_review }}
  handoff:
    description: "`merge-gate`: `true` when only unresolved review threads block the decision and no fix run is queued."
    value: ${{ steps.run.outputs.handoff }}
  repair:
    description: "`merge-gate`: `fix` when a blocked pull request (conflicts, red CI) gets a fix pass, `handoff` when a person must unblock it."
    value: ${{ steps.run.outputs.repair }}
  repair_reason:
    description: "`merge-gate`: what blocks the pull request, when `repair` is set."
    value: ${{ steps.run.outputs.repair_reason }}

runs:
  using: composite
  steps:
    - name: Check Node
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1; then
          echo 'setup=false' >> "$GITHUB_OUTPUT"
        else
          echo 'setup=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node
      if: ${{ steps.node.outputs.setup == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Run ${{ inputs.command }}
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_GATE_COMMAND: ${{ inputs.command }}
        PR_GATE_PR_NUMBER: ${{ inputs.pr-number }}
        PR_GATE_OPT_IN_LABEL: ${{ inputs.opt-in-label }}
        PR_GATE_BRANCH_PREFIXES: ${{ inputs.branch-prefixes }}
        PR_GATE_FIX_BRANCH_PREFIXES: ${{ inputs.fix-branch-prefixes }}
        PR_GATE_MAX_ROUNDS: ${{ inputs.max-rounds }}
        PR_GATE_ESCALATION_LABEL: ${{ inputs.escalation-label }}
        PR_GATE_CHECK_NAME: ${{ inputs.check-name }}
        PR_GATE_REQUIRED_HUMAN_APPROVALS: ${{ inputs.required-human-approvals }}
        PR_GATE_HUMAN_APPROVAL_EXEMPT_BASE_PREFIXES: ${{ inputs.human-approval-exempt-base-prefixes }}
        PR_GATE_HUMAN_APPROVAL_EXEMPT_AUTHORS: ${{ inputs.human-approval-exempt-authors }}
        PR_GATE_APPROVAL_LABELS: ${{ inputs.approval-labels }}
        PR_GATE_HOLD_LABELS: ${{ inputs.hold-labels }}
        PR_GATE_ROUND: ${{ inputs.round }}
        PR_GATE_START_SHA: ${{ inputs.start-sha }}
        PR_GATE_OUTCOME: ${{ inputs.outcome }}
        PR_GATE_HEAD_SHA: ${{ inputs.head-sha }}
        PR_GATE_RESULT: ${{ inputs.result }}
        PR_GATE_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        PR_GATE_MERGE_WORKFLOW: ${{ inputs.merge-workflow }}
        PR_GATE_FIX_WORKFLOW: ${{ inputs.fix-workflow }}
        PR_GATE_IGNORE_AUTHORS: ${{ inputs.ignore-authors }}
        PR_GATE_IGNORE_REPLY_AUTHORS: ${{ inputs.ignore-reply-authors }}
        PR_GATE_MERGE_CHECK_NAME: ${{ inputs.merge-check-name }}
        PR_GATE_OUTPUT_FILE: ${{ inputs.output-file }}
        PR_GATE_QA_CHECK_NAME: ${{ inputs.qa-check-name }}
        PR_GATE_REVIEW_CHECK_NAME: ${{ inputs.review-check-name }}
        PR_GATE_QA_WORKFLOW: ${{ inputs.qa-workflow }}
        PR_GATE_REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"

branding:
  icon: shield
  color: purple
